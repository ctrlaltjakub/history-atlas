name: Refresh episode catalogue

on:
  schedule:
    # Every Monday at 06:17 UTC (07:17 CET / 08:17 CEST).
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-episode-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the production branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Refresh the feed, listening links and public catalogue
        run: npm run refresh

      - name: Validate the refreshed site
        run: |
          npm test
          git diff --check

      - name: Commit and publish the updated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/feed.xml data/base-episodes.json data/catalogue-source.json \
            data/links-pocketcasts-api.json data/links-apple-lookup.txt \
            data/links-episodes.json public/data/catalogue.json
          if git diff --cached --quiet; then
            echo 'Catalogue is already current.'
          else
            git commit -m 'Refresh public episode catalogue'
            git push origin HEAD:main
          fi
